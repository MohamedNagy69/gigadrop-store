version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: gigadrop-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: gigadrop_root_password
      MYSQL_DATABASE: gigadrop
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: gigadrop-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: 'mysql://root:gigadrop_root_password@mysql:3306/gigadrop'
      NEXTAUTH_SECRET: 'gigadrop-production-secret-key-2026-secure'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
      NEXT_PUBLIC_STORE_WHATSAPP: '201012345678'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
